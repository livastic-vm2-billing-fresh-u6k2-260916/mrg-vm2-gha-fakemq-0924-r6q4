name: VM2 Scope Gate
permissions: read-all
on:
  pull_request:

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      protected: ${{ fromJSON(steps.scopes.outputs.scopes).protected }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect scopes
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          token: ${{ secrets.MERGIFY_TOKEN }}

  protected-tests:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.protected == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Required protected test
        run: |
          echo "VM2_PROTECTED_TEST_R6Q4_RAN=true"
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - protected-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate scope-aware jobs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
